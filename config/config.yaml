# Defaults. Put your own changes in config/local.yaml (see local.example.yaml) so updates never clash.
# Nova configuration. Every value here can be changed without touching code.

assistant:
  name: Nova
  wake_phrase: hey nova
  address_user_as: sir          # set to "" to disable
  owner_name: Oliver            # who made Nova and whom it serves
  timezone: America/Chicago
  personality: british_butler   # see assistant/brain/prompts.py

brain:
  # Everyday conversation. local = free model in Ollama on your GPU; anthropic = Claude API (paid).
  backend: local
  local:
    host: http://127.0.0.1:11434
    model: qwen3:4b-instruct-2507-q4_K_M   # instruct = answers straight away (no "thinking")
    # "What's on my screen": claude_code = your subscription (no GPU memory, best quality);
    # ollama = local vision model (free, but on 8 GB it evicts the chat model: ~4 s reload)
    vision: claude_code
    vision_model: qwen3-vl:4b
    vision_max_px: 1024          # smaller screenshot = much faster local vision
    vision_keep_alive: 2m
    num_ctx: 8192
    keep_alive: 30m
    think: false                 # model "thinking" adds seconds of silence; keep off for voice
    temperature: 0.6
    timeout_s: 30                 # a stalled Ollama gives up instead of freezing Nova

  # Hard tasks (research, analysis, writing, code). claude_code = your Claude Pro subscription
  # via the official Claude Code CLI; anthropic = Claude API (paid per token).
  expert:
    backend: claude_code
    claude_code:
      command: claude            # or full path to claude.exe
      model: null                # null = your plan's default; or sonnet / opus
      timeout_s: 300
      max_turns: 20
      tools: [WebSearch, WebFetch, Read]   # tools that exist: no shell, no file edits
      allowed_tools: [WebSearch, WebFetch] # Read stays confined to its own empty folder

  # Used only when backend/expert is "anthropic":
  chat_model: claude-haiku-4-5
  expert_model: claude-opus-5
  chat_max_tokens: 1024
  expert_max_tokens: 16000

  max_tool_rounds: 8             # safety cap on tool-call loops per user turn
  history_turns: 20              # user turns kept verbatim before trimming
  web_search:
    enabled: true
    max_uses: 3                  # anthropic backend (Claude server tool)
    max_results: 5               # local backend (free DuckDuckGo search)

voice:
  mode: wake                     # wake (say "Nova ..."), open_mic (answers everything), ptt (hold hotkey)
  wake:
    follow_up_s: 6               # after replying to "Nova, ...", one more request without the name (0 = off)
    acknowledgement: "Yes, sir?" # said when you only say "Nova"
    window_words: 3              # "Nova" must be within the first/last 3 words
  ptt_hotkey: ctrl+alt+space     # only used in ptt mode
  aec:
    enabled: true                # echo cancellation: Nova doesn't hear itself through speakers
    delay_ms: 60
  barge_in:
    mode: verified               # verified (safe with speakers) | fast (headphones only) | off
    merge_window_s: 2.5          # keep talking within this after a pause -> one request
  input_device: null             # null = Windows default; name or index (see: python -m assistant devices)
  output_device: null
  vad:
    threshold: 0.5               # speech probability to count a frame as speech
    end_silence_ms: 400          # silence that ends your turn (250-700)
    min_speech_ms: 150           # ignore blips shorter than this
    preroll_ms: 300              # audio kept from before speech started
    max_utterance_s: 30
    pause_ms: 160                # start transcribing during a pause (hides Whisper's time)
  stt:
    provider: whisper            # whisper (local, free) | deepgram (cloud)
    whisper:
      model: large-v3-turbo      # or distil-large-v3, small.en (faster, less accurate)
      device: auto               # auto | cuda | cpu
      compute_type: auto         # auto -> int8_float16 on GPU, int8 on CPU
      beam_size: 1
      language: en
    deepgram:
      model: nova-3
  tts:
    provider: kokoro             # kokoro (local, free)
    kokoro:
      voice: bm_george           # British male. Others: bm_lewis, bm_daniel, bf_emma, af_heart
      lang: en-gb
      speed: 1.05
      device: auto               # auto = GPU if available (scripts\enable_gpu_tts.ps1), else CPU
      threads: null              # CPU threads; run `python -m assistant ttsbench` to find the fastest
      model_file: auto           # auto = GPU-optimized copy (made by `assistant models`) on the GPU
  first_chunk_min_chars: 12      # speak the first clause early; later chunks wait for full sentences
  latency_report: true           # print per-stage timings after each spoken reply
  filler_phrases: ["One moment, sir.", "On it, sir.", "Right away, sir. Give me a moment."]
  filler_tools: [escalate, look_at_screen, web_search]   # slow tools that get a filler line

server:
  host: 127.0.0.1                # localhost only until Phase 6 (remote access)
  port: 8765
  allowed_hosts: [127.0.0.1, localhost]   # blocks DNS-rebinding attacks from web pages
  allowed_origins: []                      # no browser page may connect (HUD/PWA added later)

# The interactive window (HUD): orb, conversation, activity, Yes/No buttons, timers, routines.
# Opens with `python -m assistant voice`. Local only: 127.0.0.1, a new secret key every run.
hud:
  enabled: true
  port: 8766
  open_window: true              # false = don't open it; reopen any time: python -m assistant hud
  show_ignored: false            # also list speech Nova ignored (e.g. people in your game)

# Nova's own browser (an Edge window with its own profile): it opens sites, searches them,
# clicks, types and reads pages by itself. Your normal browser and its logins aren't touched.
browser:
  handle_websites: true          # "open kbb.com" opens it in Nova's browser so it can keep going there

# Nova on your phone, over Tailscale (your own private network; nothing opened to the internet).
# Set it up and switch it on/off in the window's Phone page. Sign-in: password + authenticator code.
phone:
  port: 8767                     # listens on the PC's Tailscale address only
  session_days: 30               # how long a phone stays signed in

tools:
  # Voice mouse ("Nova, show the grid" ... "click 14"): cells across and down the main screen.
  grid_cols: 10
  grid_rows: 6
  # Friendly names -> launch targets (a URI, an exe path, or a Start Menu shortcut name).
  app_aliases:
    spotify: "spotify:"
    discord: "discord:"
    browser: "https://www.google.com"
    chrome: "chrome.exe"
    notepad: "notepad.exe"
    calculator: "calc.exe"
    explorer: "explorer.exe"
    settings: "ms-settings:"
    task manager: "taskmgr.exe"
  screenshot:
    max_edge_px: 1568            # Claude vision downsamples anything larger
    jpeg_quality: 80

safety:
  # File tools can only touch these folders (and their OneDrive copies). Hidden folders,
  # AppData and password/key files are always refused. Deletes go to the Recycle Bin.
  allowed_folders: ["~/Desktop", "~/Documents", "~/Downloads", "~/Music", "~/Pictures", "~/Videos"]
  notes_folder: "~/Documents/Nova Notes"
  # Per-tool overrides of the risk level declared in code: safe | confirm | blocked
  risk_overrides: {}
  # Tools refused outright for remote clients (phone / other PCs).
  remote_blocked_tools: [run_shell, delete_file, move_file, power, press_key, window, mouse, mouse_grid,
                         type_text, press_keys, click_element, show_numbers, forget, teach, replay_click,
                         replay_keys, run_routine, voice_lock, dictation, browser]
  audit_log: data/audit.jsonl

# Routines: one phrase runs several steps. Say "Nova, gaming mode" (or "Nova, start gaming mode").
# Each step is a tool (list them with: python -m assistant tools) or a pause (wait: seconds).
# Steps still ask before anything risky (e.g. sleep). optional: true = don't mention if it fails.
# Add your own in config/local.yaml under "routines:"; set one to null to switch it off.
# Check them with: python -m assistant routines
routines:
  gaming_mode:
    phrases: ["gaming mode", "game mode", "time to game", "let's game"]
    reply: "Gaming mode. Steam and Discord are on their way."
    steps:
      - {tool: open_app, args: {name: steam}}
      - {tool: open_app, args: {name: discord}}
      - {tool: volume, args: {action: set, level: 60}}
  movie_time:
    phrases: ["movie time", "movie mode", "movie night"]
    reply: "Enjoy the film."
    steps:
      - {tool: music_control, args: {action: pause}, optional: true}
      - {tool: volume, args: {action: set, level: 80}}
      - {tool: open_website, args: {site: netflix}}
  heading_out:
    phrases: ["i'm heading out", "heading out", "i'm going out", "i'm off", "i'm leaving"]
    reply: "Very good. See you soon."
    steps:
      - {tool: music_control, args: {action: pause}, optional: true}
      - {wait: 2}
      - {tool: lock_pc}
  goodnight:
    phrases: ["goodnight", "good night", "i'm going to bed", "bedtime"]
    reply: "Goodnight."
    steps:
      - {tool: music_control, args: {action: pause}, optional: true}
      - {tool: volume, args: {action: set, level: 20}}
      - {tool: power, args: {action: sleep}}
