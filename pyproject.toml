[project]
name = "vesper"
version = "0.1.0"
description = "Vesper: a real-time, voice-first personal assistant for Windows"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "pydantic>=2.7",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "keyring>=25",
    "jsonschema>=4.22",
    "tzdata",
    "mss>=9",
    "pillow>=10",
    "psutil>=6",
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
vesper = "vesper.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vesper*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
