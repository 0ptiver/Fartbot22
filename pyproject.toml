[project]
name = "pc-assistant"
version = "0.1.0"
description = "Nova: a real-time, voice-first personal assistant for Windows"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "pydantic>=2.7",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "keyring>=25",
    "jsonschema>=4.22",
    "tzdata",
    "mss>=9",
    "pillow>=10",
    "psutil>=6",
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "sounddevice>=0.4.7",
    "soundfile>=0.12",
    "faster-whisper>=1.1",
    "kokoro-onnx>=0.4",
    "keyboard>=0.13; sys_platform == 'win32'",
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
    "httpx>=0.27",
    "ddgs>=9",
    "onnx>=1.16",
    "livekit>=1.0",
    "send2trash>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
assistant = "assistant.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["assistant*"]

[tool.setuptools.package-data]
"assistant.hud" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
